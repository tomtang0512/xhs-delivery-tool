<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壮壮FIT 排线台 v3</title>
<style>
  :root{--g:#1d7a4f;--g2:#27ae60;--red:#c0392b;--yellow:#e67e22;--line:#dfe5e2;--mut:#8a968f;}
  *{box-sizing:border-box}
  html,body{margin:0;background:#f4f6f5;font-family:"Microsoft YaHei",sans-serif;color:#2b3a34}
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 60px}
  header{display:flex;align-items:baseline;gap:10px;padding:10px 2px 6px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;color:var(--g)}
  header .sub{font-size:12px;color:var(--mut)}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
  .step{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .step .no{background:var(--g);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .step b{font-size:14px}
  .step .tip{font-size:12px;color:var(--mut)}
  textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical}
  button{font-family:inherit;cursor:pointer;border-radius:8px;border:0}
  .btn-main{background:var(--g2);color:#fff;font-weight:bold;font-size:14px;padding:9px 18px}
  .btn-red{background:var(--red);color:#fff;font-weight:bold;font-size:14px;padding:9px 18px}
  .btn-ghost{background:#eef3f0;color:#41544c;font-size:12px;padding:5px 10px}
  .btn-line{background:#fff;border:1px solid var(--g2);color:var(--g);font-size:12px;padding:5px 10px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  /* 确认列表 */
  .oRow{display:flex;gap:8px;align-items:flex-start;padding:7px 6px;border-bottom:1px dashed var(--line);font-size:13px}
  .oRow:last-child{border-bottom:0}
  .oRow input[type=checkbox]{margin-top:2px}
  .oMain{flex:1;min-width:0}
  .oMain .l1{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .oMain .u{font-weight:bold}
  .oMain .a{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .chip{font-size:11px;padding:1px 7px;border-radius:9px;white-space:nowrap}
  .chip.ok{background:#e7f5ee;color:var(--g)}
  .chip.new{background:#e8f1fb;color:#2471a3}
  .chip.amb{background:#fdeeee;color:var(--red)}
  .chip.fail{background:#eee;color:#888}
  .cands{margin:4px 0 0;font-size:12px;color:#555}
  .cands label{margin-right:10px;cursor:pointer}
  .mealsEd{width:40px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:12px;text-align:center}
  /* 结果 */
  .concl{background:var(--g);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.7}
  .concl small{opacity:.85}
  .risk{border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13px;line-height:1.6}
  .risk.r{background:#fdecea;border:1px solid #f5b7b1;color:#922b21}
  .risk.y{background:#fef5e7;border:1px solid #f8ddad;color:#9c640c}
  .trip{background:#fff;border:1px solid var(--line);border-left:5px solid var(--tc,#2980b9);border-radius:10px;margin:10px 0;overflow:hidden}
  .trip .head{padding:9px 12px;background:#fafcfb;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .trip .head .t{font-weight:bold;color:var(--tc,#2980b9);font-size:15px}
  .trip .head .m{font-size:12px;color:var(--mut)}
  .trip table{width:100%;border-collapse:collapse;font-size:13px}
  .trip td{padding:6px 10px;border-top:1px dashed var(--line);vertical-align:top}
  .trip td.seq{width:26px;color:var(--tc,#2980b9);font-weight:bold}
  .trip td.eta{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .trip td.eta small{display:block;color:var(--mut);font-size:11px}
  .trip .foot{padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:#fafcfb}
  .warnInline{color:var(--red);font-size:12px}
  details.ref{margin-top:10px}
  details.ref summary{cursor:pointer;font-size:13px;color:var(--mut)}
  details.ref .body{font-size:12px;color:#55655e;line-height:1.9;padding:6px 2px}
  /* 参数 */
  .params{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.params .srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;margin:2px 0}
.params .rlab{color:var(--mut);font-size:12px}
  .params input[type=time]{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:13px}
  .rchip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:14px;padding:3px 9px;font-size:12px;cursor:pointer;user-select:none}
  .rchip.on{border-color:var(--g2);background:#e7f5ee;color:var(--g);font-weight:bold}
  .sessBadge{font-size:12px;background:#eef3f0;border-radius:8px;padding:2px 8px;color:#41544c}
  #map{width:100%;height:340px;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:none}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:18px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.on{opacity:.95}
  .mut{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛵 壮壮FIT 排线台 <span style="font-size:12px;color:var(--mut)">v3 demo</span></h1>
    <span class="sub" id="todayTag"></span>
    <span class="sub">出餐点：荣华北路69号</span>
  </header>

  <!-- STEP 1 -->
  <div class="card">
    <div class="step"><span class="no">1</span><b>粘报单</b><span class="tip">群里的报单原文整段粘进来</span>
      <button class="btn-ghost" id="demoFill" style="margin-left:auto">🧪 填示例报单</button></div>
    <textarea id="rptTxt" placeholder="例：&#10;以此为准-----11:00-11:45-----&#10;#1（2餐）&#10;用户：胡萝卜&#10;地址：新加坡创新中心E栋7楼&#10;…"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn-red" id="btnParse">🔍 解析报单</button>
      <span class="mut" id="parseStat"></span>
    </div>
  </div>

  <!-- 参数（常显：解析前后都能改出发/骑手） -->
  <div class="card" id="paramCard">
    <div class="params">
      <div class="srow"><span class="sessBadge" id="sessBadge"></span><details style="margin-left:auto"><summary class="mut" style="cursor:pointer">高级参数</summary>
        <div class="row" style="margin-top:6px">
          <label>单班上限 <input type="number" id="maxTrip" value="90" min="15" max="180" style="width:52px;border:1px solid var(--line);border-radius:6px;padding:2px 4px">分</label>
          <label>均速 <input type="number" id="speed" value="20" min="10" max="45" style="width:52px;border:1px solid var(--line);border-radius:6px;padding:2px 4px">km/h</label>
          <span class="mut">弹性固定±30分 · 保温90分 · 早到≤15分自动放行；早到超出/迟到≤15分排线时问你；迟到>15分禁止 · 同址100m内自动并点</span>
        </div>
      </details></div>
      <div class="srow"><label title="午窗（午餐）出发时刻">🌞午 <input type="time" id="depart" value="10:55"></label><span class="rlab" title="勾多位=并行同发（一人一趟），只勾1位=接力顺序班（仅管午窗）">骑手</span><span id="riderBox" style="display:inline-flex;gap:5px;flex-wrap:wrap"></span></div>
      <div class="srow"><label title="晚窗（晚餐）出发时刻">🌙晚 <input type="time" id="departD" value="16:55"></label><span class="rlab" title="晚窗骑手单独勾选：勾多位=并行同发，只勾1位=接力">骑手</span><span id="riderBoxD" style="display:inline-flex;gap:5px;flex-wrap:wrap"></span></div>
    </div>
  </div>

  <!-- STEP 2 确认（有存疑/失败时才出现） -->
  <div class="card" id="confirmCard" style="display:none">
    <div class="step"><span class="no">2</span><b>确认订单</b><span class="tip">存疑/新客定位失败的需要你处理，其余已自动勾上</span></div>
    <div id="confirmList"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn-main" id="btnGo">✅ 确认并排线</button>
      <span class="mut" id="goStat"></span>
    </div>
  </div>

  <!-- STEP 3 结果 -->
  <div id="result"></div>
  <div class="card" id="mapCard" style="display:none">
    <div class="row"><b style="font-size:14px">🗺 线路图</b><button class="btn-ghost" id="mapToggle">收起地图</button></div>
    <div id="map"></div>
  </div>
  <details class="ref card" id="refBox" style="display:none"><summary>▸ 运营参考（班价 / 闪送比价 / 里程 / 接力时刻）</summary><div class="body" id="refBody"></div></details>
</div>
<div class="toast" id="toast"></div>

<script src="delivery-seed.js"></script>
<script>

function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
try{if(window.__seedRun&&!localStorage.getItem('custRebuilt'))__seedRun();}catch(e){}   // 首次：先用周报种子重建档案（幂等）
var customers=loadJSON('customers',[]);
var riders=loadJSON('riders',[]);
if(!riders.length){riders=[{name:'王师傅',home:'',pos:null,speed:28,notes:''}];saveJSON('riders',riders);}
if(!riders.some(function(r){return r.name==='周师傅';}))riders.push({name:'周师傅',home:'',pos:null,speed:28,notes:''});

/* ===== 2. 报单解析（原样移植 v2.66） ===== */
function nrmTxt(s){return (s||'').toLowerCase().replace(/[\s，,。：:；;（）()【】\[\]\-—_·、.～~]/g,'');}
function addrRuns(s){return nrmTxt(s).split(/\d+/).filter(function(x){return x.length>=3;});}
function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hav(a,b){var p1=a[1]*Math.PI/180,p2=b[1]*Math.PI/180;
  var h=Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((b[0]-a[0])*Math.PI/360)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
function km(p,q){return hav(p,q);}
function hm2min(s){var p=String(s||'').split(':');return (+p[0]||0)*60+(+p[1]||0);}
function min2hm(m){m=Math.round(m);var h=Math.floor(m/60),mm=m-h*60;if(mm<0){mm+=60;h--;}return ('0'+h).slice(-2)+':'+('0'+mm).slice(-2);}
function groupToT(g){if(!g)return '';if(/11\s*[:：]|12\s*[:：]|上午|中午/.test(g))return 'l';if(/1[7-9]\s*[:：]|下午|晚上/.test(g))return 'd';return '';}
function parseDeadlineTime(s){
  if(!s||s==='无')return null;var m;
  if((m=s.match(/(\d{1,2})\s*[:：]\s*(\d{2})/)))return (+m[1])*60+(+m[2]);
  if((m=s.match(/(\d{1,2})\s*点\s*(半|\d{1,2})?\s*分?/))){var h=+m[1],mi=m[2]==='半'?30:+(m[2]||0);if(h<24&&mi<60)return h*60+mi;}
  return null;
}
function parseRptText(raw){
  var lines=raw.replace(/\r/g,'').split('\n');
  var stats={},orders=[],group='',cur=null;
  function push(){if(cur&&(cur.addr||cur.user||cur.dishes.length))orders.push(cur);cur=null;}
  for(var li=0;li<lines.length;li++){
    var L=lines[li].trim();if(!L)continue;var m;
    if((m=L.match(/[-—=]{2,}\s*(.+?\d.+?)\s*[-—=]{2,}/))){push();group=m[1];continue;}   // 分隔线≥2个符号即可（粘贴常丢字：--17:00 - 17:45-----），段内须含数字防误判
    if(/^(上午|中午|下午|晚上)/.test(L)&&L.indexOf('：')>-1&&L.indexOf('#')<0){push();group=L;continue;}
    var Lc=L.replace(/^[^\u4e00-\u9fa5A-Za-z0-9#【（(]+/,'');   // 剥掉 ⭕⭐🔥 等任意前缀符号
    if((m=Lc.match(/^#(\d+)\s*（([^）]*)）?/))){push();cur={no:+m[1],tag:m[2]||'',dishes:[],group:group,raw:[L]};continue;}
    if((m=Lc.match(/^#(\d+)/))){push();cur={no:+m[1],tag:'',dishes:[],group:group,raw:[L]};continue;}
    if(!cur){var mm=L.match(/^(PRO碗|EASY碗|鲜蔬锅)\s*(\d+)\s*个?$/);if(mm)stats[mm[1]]=(stats[mm[1]]||0)+(+mm[2]);continue;}
    if(cur)cur.raw.push(L);   // 保留报单原文（发骑手文案用：师傅要看电话/地址）
    if(/^(用户|电话|地址|本餐备注|特殊备注|整单备注)[：:]/.test(L)){
      var k=L.match(/^(用户|电话|地址|本餐备注|特殊备注|整单备注)/)[1],v=L.replace(/^(用户|电话|地址|本餐备注|特殊备注|整单备注)[：:]/,'').trim();
      if(k==='用户')cur.user=v;else if(k==='电话')cur.phone=v;else if(k==='地址')cur.addr=v;else if(k==='整单备注')cur.memo=v;else cur.note=v;
      continue;
    }
    if(!cur.user){var fm=L.match(/^([\u4e00-\u9fa5][\u4e00-\u9fa5·]{1,5})\s+(1[3-9]\d{9})\s+(.{4,})$/);if(fm){cur.user=fm[1];cur.phone=fm[2];cur.addr=fm[3];continue;}}
    if(!cur.user){var fm2=L.match(/^([\u4e00-\u9fa5A-Za-z·]{1,10})\s*[:：]\s*(1[3-9]\d{9})\s*$/);if(fm2){cur.user=fm2[1];cur.phone=fm2[2];cur._needAddr=true;continue;}}   // 「大卫：18982405005」冒号格式：只认名字+手机，下一行补地址
    if(cur._needAddr&&!cur.addr){cur.addr=L;cur._needAddr=false;continue;}
    if(!cur.user&&!/^[-—=]{3,}$/.test(L))cur.dishes.push(L);
  }
  push();
  orders.forEach(function(o){
    var tM=(o.tag||'').match(/(\d+)\s*餐/);
    if(tM)o.meals=+tM[1];
    else{var nC=0;o.dishes.forEach(function(d){var c=d.match(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮]/g);if(c&&c.length>nC)nC=c.length;});
      if(nC===0&&o.dishes.length>1){var nD=0;o.dishes.forEach(function(d){if(/(碗|三拼|双拼|锅|蛋白|pro|easy)/i.test(d))nD++;});if(nD>1)nC=nD;}   // 多行菜名无①②序号：按整菜行数估餐数
      o.meals=nC>0?nC:1;}
    if(!o.addr&&o.dishes.length>1){var ld=o.dishes[o.dishes.length-1];if(ld.length<=12&&!/[:：]/.test(ld)){o.addr=ld;o.dishes.pop();}}   // 「大卫：电话」后下一行是地点：补成地址
    var tms=[],tre=/((\d{1,2})\s*[:：]\s*(\d{2}))/g,tm2;
    while((tm2=tre.exec(o.group||'')))tms.push((+tm2[2])*60+(+tm2[3]));
    if(tms.length>=2){o.winS=tms[0];o.winE=tms[tms.length-1];}
    else if(tms.length===1){o.winE=tms[0];o.winS=Math.max(0,tms[0]-45);}
    if(tms.length)o.dlMin=o.winE;
    o.dlMemo=parseDeadlineTime(o.memo||'')||parseDeadlineTime(o.note||'');
    if(o.dlMemo!=null)o.dlMin=(o.dlMin!=null?Math.min(o.dlMin,o.dlMemo):o.dlMemo);
    o.eaWanted=(function(s){
      if(!s||s==='无')return null;
      if(!/希望|别太早|不要太早|不早于|不要早于|别早于|凉了/.test(s))return null;
      if(/之前|以前|点前|前送/.test(s))return null;
      var m=s.match(/(\d{1,2})\s*[:：点]\s*(半|\d{1,2})?/);
      if(m){var h=+m[1],mi=m[2]==='半'?30:+(m[2]||0);if(h<24&&mi<60)return h*60+mi;}
      return 'winS';})(o.memo||'')||(function(s){
      if(!s||s==='无')return null;
      if(!/希望|别太早|不要太早|不早于|不要早于|别早于|凉了/.test(s))return null;
      if(/之前|以前|点前|前送/.test(s))return null;
      var m=s.match(/(\d{1,2})\s*[:：点]\s*(半|\d{1,2})?/);
      if(m){var h=+m[1],mi=m[2]==='半'?30:+(m[2]||0);if(h<24&&mi<60)return h*60+mi;}
      return 'winS';})(o.note||'');
  });
  return {stats:stats,orders:orders};
}
function matchCustIdx(user,addr){
  var u=nrmTxt(user).replace(/(先生|女士|小姐|同学|老师|总|哥|姐)$/,'');
  var a=nrmTxt(addr);
  var scored=customers.map(function(c,i){
    var s=0;var nn=nrmTxt(c.name);
    var nt=nrmTxt(c.note).replace(/\d{1,2}\s*[:：点]\s*\d{0,2}/g,'');   // 备注先剔除时刻（"12:00前"→"前"），防数字别名误撞
    if(u){var uDig=/^\d{1,2}$/.test(u);   // 1~2位纯数字别名（如客户"12"）：只认客户名不认备注——备注里的时间是误撞重灾区
      if(u.length>=2&&((!uDig&&nt.indexOf(u)>-1)||nn.indexOf(u)>-1))s+=3;
      else if(u.length===1&&nt.indexOf(u)>-1)s+=1;}
    addrRuns(c.name).concat(addrRuns(c.addr)).forEach(function(r){
      if(AREA_STOPS.indexOf(r)>-1)return;
      if(a.indexOf(r)>-1)s+=2+(r.length>=5?1:0);});
    var digits=nrmTxt(c.addr).match(/\d+/g)||[];
    if(digits.length&&!digits.some(function(d){return a.indexOf(d)>-1;}))s=Math.max(0,s-2);
    return {i:i,s:s,c:c};
  }).sort(function(x,y){return y.s-x.s;});
  var top=scored[0];
  if(!top||top.s<3)return null;
  var amb=scored.filter(function(x){return x.s>=3&&top.s-x.s<2;}).length>1;
  return {i:top.i,s:top.s,c:top.c,amb:amb,alts:scored.filter(function(x){return x.s>=3;}).slice(0,4)};
}

function geoOne(text){
  if(geoCache[text]&&geoCache[text].loc)return Promise.resolve(geoCache[text].loc);
  function okLoc(l){return l&&isFinite(l.lng)&&isFinite(l.lat)&&hav([l.lng,l.lat],ORIGIN)<=20;}
  function parseLoc(s){var xy=String(s||'').split(',');if(xy.length!==2)return null;return {lng:+xy[0],lat:+xy[1]};}
  function save(loc){geoCache[text]={loc:loc,label:''};saveJSON('geoCache',geoCache);return loc;}
  function pick(list){   // 多候选里挑配送圈内的第一个（防止错命中到都江堰等远郊）
    for(var i=0;i<list.length;i++){var l=parseLoc(list[i].location);if(okLoc(l))return l;}
    return null;}
  function q(t){
    var url='https://restapi.amap.com/v3/geocode/geo?key='+KEY+'&address='+encodeURIComponent(t)+'&city='+encodeURIComponent('成都')+'&citylimit=true&output=JSON';
    return getJSON(url).then(function(j){
      if(j.status==='1'&&j.geocodes&&j.geocodes.length){var g=pick(j.geocodes);if(g)return g;}
      var url2='https://restapi.amap.com/v3/place/text?key='+KEY+'&keywords='+encodeURIComponent(t)+'&city='+encodeURIComponent('成都')+'&citylimit=true&output=JSON';
      return getJSON(url2).then(function(j2){
        if(j2.status==='1'&&j2.pois&&j2.pois.length){var p=pick(j2.pois);if(p)return p;}
        return null;});
    });
  }
  return q(text).then(function(r){if(r)return save(r);
    if(!/^四川省?成都市?/.test(text))return q('成都市'+text).then(function(r2){return r2?save(r2):null;});
    return null;});
}
function getJSON(url,retries){
  retries=retries===undefined?2:retries;
  return fetch(url).then(function(r){return r.text().then(function(t){
    var t2=t.trim();
    if(t2.charAt(0)!=='{'&&t2.charAt(0)!=='[')throw new Error('net');
    return JSON.parse(t2);});})
  .catch(function(e){if(retries>0)return new Promise(function(res){setTimeout(res,800);}).then(function(){return getJSON(url,retries-1);});
    throw e;});
}

    html+='<div class="risk y" id="askPanel" style="margin-top:10px"><b>❓ '+asks.length+' 处时间需要你拍板</b>（本方案靠这些早到/晚到才排得下；你选完我按答案重排，选「不行」的那几单会自动换回去）';
    asks.forEach(function(a,i){
      html+='<div class="askItem" data-key="'+escHtml(a.key)+'" data-kind="'+a.kind+'" data-gap="'+a.gap+'" style="margin:8px 0;padding:8px 10px;border:1px dashed #d9a441;border-radius:8px;background:rgba(217,164,65,.06)">'
        +'<b>'+escHtml(a.nm)+'</b>：计划 <b>'+a.plan+'</b> 到（'+a.ref+'，'+a.disp+'）——可以吗？ '
        +'<label style="margin-left:8px"><input type="radio" name="ask'+i+'" value="y" checked> 可以</label> '
        +'<label style="margin-left:8px"><input type="radio" name="ask'+i+'" value="n"> 不行</label></div>';});
    html+='<button class="btn-red" id="askGo">按你的选择重排</button></div>';
  }
  html+='<div class="row" style="margin-top:6px"><button class="btn-ghost" id="copyAll">📋 复制全部趟（发排班群）</button><button class="btn-ghost" id="showMapBtn">🗺 显示地图</button></div>';
  el.innerHTML=html;
  el.querySelectorAll('[data-copy]').forEach(function(b){b.onclick=function(){copyTrip(+b.getAttribute('data-copy'));};});
  el.querySelectorAll('[data-map]').forEach(function(b){b.onclick=function(){showMap(+b.getAttribute('data-map'));};});
  var ca=document.getElementById('copyAll');if(ca)ca.onclick=copyAll;
  var sm=document.getElementById('showMapBtn');if(sm)sm.onclick=function(){showMap(-1);};
  var ag=document.getElementById('askGo');
  if(ag)ag.onclick=function(){
    el.querySelectorAll('.askItem').forEach(function(it){
      var key=it.getAttribute('data-key'),kind=it.getAttribute('data-kind'),gap=+it.getAttribute('data-gap');
      var yes=it.querySelector('input[value=y]:checked');
      _askMap[key]=_askMap[key]||{};
      if(kind==='e')_askMap[key].e=yes?Math.max(gap,(_askMap[key].e>0?_askMap[key].e:0)):-1;
      else _askMap[key].l=yes?Math.max(gap,(_askMap[key].l>0?_askMap[key].l:0)):-1;});
    if(_rowsForReplan){toast('按你的拍板重排中…');runPlan(_rowsForReplan);}};
  document.getElementById('paramCard').style.display='';
  renderRef();
  showMap(-1);
  function glabelOf(g){return g.names.map(function(m){return m.name;}).join('+');}
}

/* ===== 客诉联动（badcase-tracker 云端 data.json；电话+客户名双保险匹配：两个都对上才标记） ===== */
var BC_URL='https://tomtang0512.github.io/badcase-tracker/data.json';
var bcMap={};   // 归一化电话|客户名 复合键 -> {n, last, tps:[]}
function normPhone(p){return String(p||'').replace(/[\s-]/g,'');}
function bcKey(ph,nm){return normPhone(ph)+'|'+String(nm||'').trim();}
function loadBc(){
  fetch(BC_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d||!Array.isArray(d.records))return;
    bcMap={};
    d.records.forEach(function(rc){
      var ph=normPhone(rc.phone);var nm=String(rc.customerName||'').trim();
      if(!ph||!nm)return;   // 缺任一项不参与匹配（双保险）
      var k=ph+'|'+nm;
      var b=bcMap[k]||(bcMap[k]={n:0,last:'',tps:[]});
      b.n++;
      if(String(rc.date||'')>b.last)b.last=String(rc.date||'');
      var t=String(rc.type||'').split('·').pop().trim();if(t&&b.tps.indexOf(t)<0)b.tps.push(t);
    });
    if(planOut)renderResult();   // 已有排线结果时重渲染补风险标
  }).catch(function(){});
}
function bcMark(g){
  var hits=[];
  ((g&&g.rows)||[]).forEach(function(r){
    var b=bcMap[bcKey(r&&r.phone,r&&r.user)];
    if(b)hits.push({nm:String(r.user||'').trim(),b:b});   // 复合键命中=电话+客户名双保险
  });
  if(!hits.length)return '';
  var tt='客诉史（电话+客户名双匹配）：'+hits.map(function(h){
    return h.nm+' '+h.b.n+'次（最近'+h.b.last.slice(5)+' '+h.b.tps.slice(0,3).join('/')+'）';
  }).join('；');
  return ' <span style="color:#e4572e;font-weight:bold" title="'+escHtml(tt)+'">🔥 重点核对</span>';
}
function tripCopyText(ti){
  var P=planOut,tr=P.trips[ti],v=tr._v;
  var no=P.trips.slice(0,ti).filter(function(t){return t.sess===tr.sess;}).length+1;
  var lines=[((tr.rider&&tr.rider.name)||'骑手')+'，这一趟大概'+v.kmOut.toFixed(1)+'公里，'+tr.seg.length+'个点位，一趟'+v.rp.p+'元，需要'+min2hm(tr.dep)+'到店；地址含以下：'];
  tr.seg.forEach(function(gi,q){
    var g=P.groups[gi];
    var raws=[];(g.rows||[]).forEach(function(r){if(r.raw&&r.raw.length)raws.push(r.raw.join('\n'));});   // 报单原文块（含电话/地址/备注）
    lines.push((q+1)+'）'+(raws.length?raws.join('\n'):g.names.map(function(m){return m.name;}).join('+')+' '+g.meals+'餐（'+min2hm(v.etas[q].t)+'到）'));
  });
  lines.push('🌹');
  return lines.join('\n');
}
function copyTrip(ti){
  var t=tripCopyText(ti);
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('已复制第'+(ti+1)+'趟文案');})
  .catch(function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制第'+(ti+1)+'趟文案');});
}
function copyAll(){
  var P=planOut;
  var lines=['【'+new Date().toLocaleDateString('zh-CN')+' 排班】共'+P.trips.length+'趟'+P.totMeals+'餐'];
  P.trips.forEach(function(tr,ti){lines.push(tripCopyText(ti));});
  var t=lines.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('已复制全部趟');})
  .catch(function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制全部趟');});
}
function renderRef(){
  var P=planOut,box=document.getElementById('refBox');box.style.display='';
  var lines=[];
  lines.push('📏 全线里程 '+P.totKm.toFixed(1)+'km（高德实测，失败段直线×1.35）');
  P.sessions.forEach(function(s){
    if(P.sessions.length>1)lines.push('<b>'+(s.key==='d'?'🌙 晚窗':'🌞 午窗')+'</b>（'+min2hm(s.dep)+' 出发）');
    s.trips.forEach(function(tr,q){var v=tr._v;
      var adv=(v.meals*GATE>=v.rp.p)?'✅ 过闸（'+v.meals+'餐×'+GATE+'≥'+v.rp.p+'）':'⚠️ 未过闸（'+v.meals+'餐×'+GATE+'＜'+v.rp.p+'），建议自送/攒班';
      lines.push('第'+(q+1)+'趟：班价 <b>'+v.rp.p+'元</b>（'+tr.seg.length+'点×'+(v.kmOut<=3?'≤3':v.kmOut<=8?'4~8':v.kmOut<=13?'9~13':'14+km')+'km档）· 餐均 '+(v.rp.p/Math.max(1,v.meals)).toFixed(1)+'元 · '+adv);
      if(v.waited>0.5)lines.push('　└ 含等送达窗口约 '+Math.round(v.waited)+' 分（不能早于窗口起点），可调晚出发减少空等');});
    if(s.round&&s.trips.length>1)lines.push('🔁 单人接力：'+s.trips.map(function(tr,q){return '趟'+(q+1)+' '+min2hm(tr.dep)+'出发→'+min2hm(tr._v.fin)+'回店';}).join(' → '));
  });
  document.getElementById('refBody').innerHTML=lines.join('<br>');
}

/* ===== 6. 路线图（自绘 SVG：高德实测路线折线 + 点位标签 + 图例，点击趟可高亮） ===== */
var _mapSel=-1;
function addrShort(s){s=(s||'').replace(/^四川省?/,'').replace(/^成都市?/,'').replace(/^(武侯区|双流区|锦江区|青羊区|金牛区|成华区|高新区|天府新区|郫都区|龙泉驿区|新津区|东部新区)/,'');return s.length>13?s.slice(0,13)+'…':s;}
function renderMap(focusTi){
  var P=planOut;if(!P)return;
  if(focusTi!=null)_mapSel=focusTi;   // 从「地图看这趟」进入默认选中该趟；-1=全显
  var sel=(_mapSel>=0&&_mapSel<P.trips.length)?_mapSel:-1;
  var mdiv=document.getElementById('map');
  var legs=P.mapLegs||[];
  if(!legs.length){mdiv.innerHTML='<div style="padding:20px;text-align:center;color:#888">暂无路线数据（高德路线接口失败时无折线）</div>';return;}
  var pts=[ORIGIN];legs.forEach(function(l){pts=pts.concat(l.pts);});
  var mnL=1e9,mxL=-1e9,mnA=1e9,mxA=-1e9;
  pts.forEach(function(q){if(q[0]<mnL)mnL=q[0];if(q[0]>mxL)mxL=q[0];if(q[1]<mnA)mnA=q[1];if(q[1]>mxA)mxA=q[1];});
  var W=760,H=430,pad=46;
  var spx=(mxL-mnL)||0.001,spa=(mxA-mnA)||0.001;
  var sc=Math.min((W-2*pad)/spx,(H-2*pad)/spa);
  var ox=(W-spx*sc)/2,oy=(H-spa*sc)/2;
  function X(q){return (ox+(q[0]-mnL)*sc).toFixed(1);}
  function Y(q){return (oy+(mxA-q[1])*sc).toFixed(1);}
  // —— 图例（每趟一枚，可点击切换高亮） ——
  var legend='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
  P.trips.forEach(function(tr,ti){
    var c=TRIP_COLORS[ti%TRIP_COLORS.length];
    var no=P.trips.slice(0,ti).filter(function(t){return t.sess===tr.sess;}).length+1;
    var v=tr._v||{};
    legend+='<span class="lgChip" data-lg="'+ti+'" title="点击只看这趟 / 再点取消" style="cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:14px;font-size:12px;background:#fff;border:1.5px solid '+(sel===ti?c:'#dfe5e2')+';'+(sel>=0&&sel!==ti?'opacity:.45;':'')+'">'
      +'<i style="width:10px;height:10px;border-radius:3px;background:'+c+';display:inline-block"></i>'
      +(tr.sess==='d'?'🌙':'🌞')+'第'+no+'趟·'+escHtml((tr.rider&&tr.rider.name)||'')+'·'+tr.seg.length+'点'+(v.meals||'')+'餐·'+min2hm(tr.dep)+'发</span>';});
  legend+='</div>';
  // —— SVG ——
  var svg='<svg width="100%" height="340" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="background:#f6f9f7;border:1px solid #dfe5e2;border-radius:8px;display:block">'
    +'<style>.tripG{cursor:pointer}.tripG:hover .ln{stroke-width:5.5}</style>';
  var allStops=[];   // 全部点位（含被淡出趟），作为标签避让障碍
  P.trips.forEach(function(tr,ti){
    tr.seg.forEach(function(gi,qi){
      var g=P.groups[gi];
      allStops.push({cx:+X(g.pos),cy:+Y(g.pos)});
    });
  });
  var obstacles=allStops.map(function(s){return {x1:s.cx-15,y1:s.cy-15,x2:s.cx+15,y2:s.cy+15};});
  var oX=+X(ORIGIN),oY=+Y(ORIGIN);
  obstacles.push({x1:oX-9,y1:oY-9,x2:oX+80,y2:oY+9});   // 出餐点标记+文字
  function hit(b){for(var i=0;i<obstacles.length;i++){var o=obstacles[i];
    if(b.x1<o.x2&&b.x2>o.x1&&b.y1<o.y2&&b.y2>o.y1)return true;}return false;}
  function placeLabel(cx,cy,w){   // 6方位尝试，返回第一个不撞的位置；全撞时用最后一个兜底
    var CAND=[[13,-4,'start'],[13,18,'start'],[-13,-4,'end'],[-13,18,'end'],[0,-30,'middle'],[0,30,'middle']];
    var best=null;
    for(var i=0;i<CAND.length;i++){var dx=CAND[i][0],dy=CAND[i][1],anc=CAND[i][2];
      var tx=cx+dx,ym=cy+dy;
      var b={y1:ym-11,y2:ym+15,x1:0,x2:0};
      b.x1=(anc==='end')?tx-w-2:(anc==='middle'?tx-w/2-2:tx-2);
      b.x2=b.x1+w+4;
      if(!hit(b)){best={anc:anc,tx:tx,ym:ym};obstacles.push(b);break;}
      best={anc:anc,tx:tx,ym:ym};}
    return best;
  }
  var labelJobs=[];   // {ti,g,eta,cx,cy,nm,ad}
  P.trips.forEach(function(tr,ti){
    var c=TRIP_COLORS[ti%TRIP_COLORS.length];
    var dim=sel>=0&&sel!==ti;
    var op=dim?' opacity="0.15"':'';
    var w=(sel===ti)?5.5:3.5;
    svg+='<g class="tripG" data-ti="'+ti+'">';
    legs.forEach(function(l){
      if(l.ti!==ti)return;
      var d=l.pts.map(function(q,i){return (i?'L':'M')+X(q)+' '+Y(q);}).join('');
      svg+='<path class="ln" d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-opacity="0.85" stroke-linejoin="round" stroke-linecap="round"'+op+'/>';
    });
    tr.seg.forEach(function(gi,qi){
      var g=P.groups[gi],eta=(tr._v&&tr._v.etas[qi])?min2hm(tr._v.etas[qi].t):'';
      var cx=+X(g.pos),cy=+Y(g.pos);
      svg+='<circle cx="'+cx+'" cy="'+cy+'" r="10" fill="'+c+'" stroke="#fff" stroke-width="2"'+op+'/>';
      svg+='<text x="'+cx+'" y="'+(cy+3.5)+'" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold"'+op+'>'+(qi+1)+'</text>';
      if(dim)return;   // 被淡出的趟不画标签，避免糊成一团
      labelJobs.push({ti:ti,g:g,cx:cx,cy:cy,
        nm:g.names.map(function(m){return m.name;}).join('+')+' '+g.meals+'餐'+(eta?' · '+eta+'到':''),
        ad:addrShort(g.names[0].addr)});
    });
    svg+='</g>';
  });
  // —— 标签统一避让绘制（从上到下），归属各自趟的 group 内 ——
  var byTi={};
  labelJobs.sort(function(a,b){return a.cy-b.cy||a.cx-b.cx;}).forEach(function(j){
    var w=Math.max(j.nm.length*10.5,j.ad.length*9.5)+10;
    var p=placeLabel(j.cx,j.cy,w);
    (byTi[j.ti]=byTi[j.ti]||[]).push('<text x="'+p.tx+'" y="'+p.ym+'" text-anchor="'+p.anc+'" font-size="10.5" fill="#1c2b26" font-weight="bold" style="paint-order:stroke" stroke="#ffffff" stroke-width="3">'+escHtml(j.nm)+'</text>'
      +'<text x="'+p.tx+'" y="'+(p.ym+12)+'" text-anchor="'+p.anc+'" font-size="9.5" fill="#5d6f68" style="paint-order:stroke" stroke="#ffffff" stroke-width="3">'+escHtml(j.ad)+'</text>');
  });
  // —— 标签统一避让绘制（从上到下），追加在各趟 group 之后的独立交互层 ——
  var lbl='';
  P.trips.forEach(function(tr,ti){
    var dim=sel>=0&&sel!==ti;
    if(dim)return;
    lbl+='<g class="tripG" data-ti="'+ti+'" style="fill-opacity:1">'+(byTi[ti]||[]).join('')+'</g>';
  });
  svg+=lbl;
  svg+='<rect x="'+(X(ORIGIN)-7)+'" y="'+(Y(ORIGIN)-7)+'" width="14" height="14" rx="3" fill="#c0392b" stroke="#fff" stroke-width="2"/>';
  svg+='<text x="'+(+X(ORIGIN)+12)+'" y="'+(+Y(ORIGIN)+4)+'" font-size="12" fill="#c0392b" font-weight="bold" style="paint-order:stroke" stroke="#ffffff" stroke-width="3">🍳 出餐点</text>';
  svg+='</svg>';
  mdiv.innerHTML=legend+svg;
  // —— 交互：点趟/图例切换高亮；点空白取消 ——
  function setSel(ti){_mapSel=(_mapSel===ti)?-1:ti;renderMap();}
  mdiv.querySelectorAll('.tripG').forEach(function(g){g.addEventListener('click',function(ev){ev.stopPropagation();setSel(+g.getAttribute('data-ti'));});});
  mdiv.querySelectorAll('.lgChip').forEach(function(ch){ch.addEventListener('click',function(ev){ev.stopPropagation();setSel(+ch.getAttribute('data-lg'));});});
  mdiv.querySelectorAll('svg').forEach(function(s){s.addEventListener('click',function(){_mapSel=-1;renderMap();});});
}
function showMap(ti){
  document.getElementById('mapCard').style.display='';
  var mdiv=document.getElementById('map');
  mdiv.style.display='block';
  renderMap(ti<0?-1:ti);
  // 滚到地图卡，否则结果页长时点了像没反应
  var mc=document.getElementById('mapCard');
  if(mc&&mc.scrollIntoView)mc.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('mapToggle').onclick=function(){
  var mdiv=document.getElementById('map');
  var hide=mdiv.style.display!=='none';
  mdiv.style.display=hide?'none':'block';
  this.textContent=hide?'显示地图':'收起地图';
};

/* 骑手 chips */
function selRiders(win){return riders.filter(function(r){return win==='d'?(!!r._onD):(!!r._on);});}
function renderRiders(){
  var box=document.getElementById('riderBox'),boxD=document.getElementById('riderBoxD');
  if(!box)return;box.innerHTML='';if(boxD)boxD.innerHTML='';
riders.forEach(function(r){
var s=document.createElement('span');s.className='rchip'+(r._on?' on':'');
s.innerHTML=escHtml(r.name);
s.title='午窗：点击勾选/取消：勾多位=并行同发（一人一趟），只勾1位=接力顺序班';
s.onclick=function(){r._on=!r._on;renderRiders();};
box.appendChild(s);
if(boxD){var s2=document.createElement('span');s2.className='rchip'+(r._onD?' on':'');
s2.innerHTML=escHtml(r.name);
s2.title='晚窗：点击勾选/取消，与午窗独立';
s2.onclick=function(){r._onD=!r._onD;renderRiders();};
boxD.appendChild(s2);}});
}
renderRiders();
if(riders[0]){riders[0]._on=true;riders[0]._onD=true;renderRiders();}
