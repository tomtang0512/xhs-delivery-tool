<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>geocode</title>
<script src="https://webapi.amap.com/maps?v=1.4.15&key=e9973067b859c02990c6b19729ffdce7&plugin=AMap.Geocoder"></script>
</head><body><pre id="out">running...</pre>
<script>
var ADDR = [
  ['德商国际', '成都市天府大道北段1480号德商国际大厦'],
  ['高新孵化园', '成都市益州大道北段1593号成都高新孵化园'],
  ['中建天府公馆', '成都市高新区观东三街899号中建天府公馆'],
  ['西昌铁路公安处', '成都市双流区西昌铁路公安处'],
  ['腾讯大厦', '成都市高新区天府三街腾讯大厦B座'],
  ['环球中心', '成都市武侯区天府大道北段1700号环球中心'],
  ['锦龙云府', '成都市天府大道南段锦龙街99号锦龙云府'],
  ['阿里巴巴西部基地', '成都市高新区阿里巴巴西部基地']
];
window.__geo = {};
var geo = new AMap.Geocoder({city:'成都'});
var i = 0;
function next(){
  if(i >= ADDR.length){ document.getElementById('out').textContent = 'DONE ' + JSON.stringify(window.__geo); window.__done = true; return; }
  var it = ADDR[i];
  geo.getLocation(it[1], function(status, result){
    if(status === 'complete' && result.geocodes && result.geocodes.length){
      var g = result.geocodes[0];
      window.__geo[it[0]] = [g.location.getLng(), g.location.getLat(), g.formattedAddress || ''];
    } else {
      var info = result && result.info ? result.info : '';
      window.__geo[it[0]] = 'FAIL:' + status + ':' + info;
    }
    i++; next();
  });
}
setTimeout(next, 800);
</script></body></html>
