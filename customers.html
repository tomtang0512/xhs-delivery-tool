function dstr(back){var d=new Date();d.setDate(d.getDate()-back);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var BASE_T=null;   // 分类基准日 = max(今天, 数据最新日期)：周报数据截止日早于今天时，按数据口径倒查
function setBase(maxD){var t=new Date(maxD+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);BASE_T=t>n?t:new Date(n);}
function daysAgo(ds){var d=new Date(ds+'T00:00:00'),t=BASE_T||new Date();t.setHours(0,0,0,0);return Math.round((t-d)/86400000);}

var demo=false,log=[],logMaxD=null;
try{if(window.__seedRun)__seedRun();}catch(e){}   // 首次打开先把周报种子重建档案+配送记录，再读
var customers=[];try{customers=JSON.parse(localStorage.getItem('customers')||'[]');}catch(e){}
if(!customers.length)customers=DEFAULT_CUSTOMERS;   // 独立打开时的兜底（不写回，主工具入库后自动共用）
try{log=JSON.parse(localStorage.getItem('deliveryLog')||'[]');}catch(e){}
if(log.length){log.forEach(function(r){if(r.d&&(!logMaxD||r.d>logMaxD))logMaxD=r.d;});if(logMaxD)setBase(logMaxD);}
if(!log.length){log=genDemo();demo=true;}   // 演示数据只在内存，真实记录一旦积累即自动替代
function genDemo(){
  var out=[];
  customers.forEach(function(c,i){
    var r=Math.abs(Math.sin(i*127.1)*43758.5453)%1;
    var mode=r<0.45?'act':(r<0.72?'fade':'lost');
    var win=c.t==='b'?(i%2?'l':'d'):(c.t||'l');
    var meals=c.meals||1;
    if(mode==='act'){var n=3+Math.floor(r*47)%5;
      for(var k=0;k<n;k++)out.push({d:dstr(Math.floor((r*97+k*53)%7)),name:c.name,addr:c.addr,win:win,meals:meals});}
    else if(mode==='fade'){var n2=2+Math.floor(r*31)%4;
      for(var k2=0;k2<n2;k2++)out.push({d:dstr(8+Math.floor((r*71+k2*37)%7)),name:c.name,addr:c.addr,win:win,meals:meals});}
    else{var back=15+Math.floor(r*89)%40;
      if(back<=30)out.push({d:dstr(back),name:c.name,addr:c.addr,win:win,meals:meals});}
  });
  var jk=customers.filter(function(c){return c.name==='晶科一号';})[0];
  if(jk)out.push({d:dstr(22),name:jk.name,addr:'武侯区天晖路360号晶科一号1512（旧工位）',win:'l',meals:1});   // 双地址演示
  return out;
}

/* ===== 聚合：一个地址 = 一个点（同用户多地址各自独立，基于地址看习惯） ===== */
var pts=[];   // {name,addr,lng,lat,win,recs:[{d,win,meals}],cls,lastDays,otherAddr}
customers.forEach(function(c){
  if(c.lng==null)return;
  var recs=log.filter(function(r){return r.name===c.name&&r.addr===c.addr;});
  var others=log.filter(function(r){return r.name===c.name&&r.addr!==c.addr;});
  var othSummary='';
  if(others.length){
    var oa={};others.forEach(function(r){oa[r.addr]=(oa[r.addr]||0)+1;});
    othSummary='同用户 2 个地址，另一地址为 '+Object.keys(oa).join('、')+'（近30天 '+others.length+' 单）';
  }
  var last=null;recs.forEach(function(r){if(!last||r.d>last)last=r.d;});
  var lastDays=last?daysAgo(last):999;
  var cls=lastDays<=7?'act':(lastDays<=14?'fade':'lost');
  pts.push({name:c.name,addr:c.addr,lng:c.lng,lat:c.lat,win:c.t||'',recs:recs.slice().sort(function(a,b){return b.d.localeCompare(a.d);}),
    cls:cls,lastDays:lastDays,otherAddr:othSummary,cx:c.cx||'',note:c.note||''});
});
/* 30天内总单数排序的记录计数 */
var nCount={act:0,fade:0,lost:0};pts.forEach(function(p){nCount[p.cls]++;});
document.getElementById('nAct').textContent=nCount.act;
document.getElementById('nFade').textContent=nCount.fade;
document.getElementById('nLost').textContent=nCount.lost;

/* 热力半径：近30天单数越多，点越大（sqrt 压缩，避免头部过大） */
pts.forEach(function(p){p.n30=p.recs.filter(function(r){return daysAgo(r.d)<=30;}).length;});
var maxN=Math.max.apply(null,pts.map(function(p){return p.n30;}).concat([5]));
function heatR(n){return 4.5+10*Math.sqrt(n/maxN);}

/* ===== 地图 ===== */
var map=new AMap.Map('map',{zoom:12,center:[104.07,30.57],viewMode:'2D',mapStyle:'amap://styles/dark'});
// 容器尺寸变化（父页「⛶ 大地图」切换）后重算地图视口
window.__fitMap=function(){
  var box=document.getElementById('map');
  try{map.resize&&map.resize();}catch(e){}
  try{map.setSize&&map.setSize(new AMap.Size(box.clientWidth,box.clientHeight));}catch(e2){}
  try{map.panBy(1,0);map.panBy(-1,0);}catch(e3){}   // 强制重绘铺满新尺寸
};
if(window.ResizeObserver){try{new ResizeObserver(function(){window.__fitMap();}).observe(document.getElementById('map'));}catch(e){}}
new AMap.Circle({center:ORIGIN,radius:3000,strokeColor:'#27ae60',strokeWeight:1,strokeOpacity:.5,strokeStyle:'dashed',fillColor:'#27ae60',fillOpacity:.04,map:map});
new AMap.Marker({position:ORIGIN,map:map,content:'<div style="background:#c0392b;color:#fff;padding:3px 10px;border-radius:12px;font-size:12px;white-space:nowrap">🍳 出餐点</div>',anchor:'center',zIndex:300});
var markers=[];
pts.forEach(function(p,i){
  var c=CLS[p.cls].c;
  var label='<b>'+esc(p.name)+'</b>·'+esc(addrShort(p.addr))+'·'+(WIN[p.win]||'');
  var m=new AMap.Marker({position:[p.lng,p.lat],map:map,zIndex:p.cls==='act'?120:(p.cls==='fade'?110:100),
    content:'<div class="pin" style="background:'+c+';border-color:'+c+';color:#fff" data-i="'+i+'">'+label+'</div>',anchor:'bottom-left'});
  var dot=new AMap.CircleMarker({center:[p.lng,p.lat],radius:heatR(p.n30),fillColor:c,fillOpacity:p.cls==='lost'?0.55:0.9,strokeColor:'#fff',strokeWeight:1.5,map:map,zIndex:p.cls==='act'?119:109});
  function open(ev){showCard(i);m.setTop&&m.setTop();}
  m.on('mouseover',open);m.on('click',open);dot.on('mouseover',open);dot.on('click',open);
  markers.push({m:m,dot:dot,cls:p.cls,i:i});
});

/* ===== 卡片 ===== */
function showCard(i){
  var p=pts[i],c=CLS[p.cls];
  var el=document.getElementById('card');
  var h='<h2>'+esc(p.name)+'</h2><div class="addr">'+esc(p.addr)+'</div>'
    +'<div class="chips"><span class="chip" style="background:'+c.c+';border-color:'+c.c+';color:#fff">'+c.label+(p.lastDays<=30?(' · 最近 '+p.lastDays+' 天前'):' · 30天无记录')+'</span>'
    +(p.win?'<span class="chip">窗口 '+WIN[p.win]+'</span>':'')
    +(p.cx==='hard'?'<span class="chip">电梯难等·停8分</span>':(p.cx==='easy'?'<span class="chip">好送·停3分</span>':''))
    +'<span class="chip">近30天 '+p.recs.length+' 单</span></div>';
  if(p.otherAddr)h+='<div class="memo">📌 '+esc(p.otherAddr)+'</div>';
  var bc=bcMap[p.name];
  if(bc)h+='<div class="memo" style="background:#fdeee6;border-color:#f3c3ae;color:#a33d1a">🔥 客诉史 '+bc.n+' 次（最近 '+bc.last+'｜'+esc(bc.tps.slice(0,3).join('、'))+'）——配送重点核对</div>';
  if(p.note)h+='<div class="sum">📝 '+esc(p.note)+'</div>';
  if(p.recs.length){
    h+='<div class="rec">';
    p.recs.forEach(function(r){h+='<div class="d"><span>'+r.d+' · '+(WIN[r.win]||r.win)+'</span><em>'+r.meals+'餐</em></div>';});
    h+='</div>';
    var lw={l:0,d:0};p.recs.forEach(function(r){lw[r.win]=(lw[r.win]||0)+1;});
    var habit=Object.keys(lw).filter(function(k){return lw[k];}).sort(function(a,b){return lw[b]-lw[a];}).map(function(k){return WIN[k]+'×'+lw[k];}).join(' / ');
    h+='<div class="sum">习惯：'+habit+(p.recs.length>=3?(' · 约每 '+Math.max(1,Math.round(30/p.recs.length))+' 天 1 单'):'')+'</div>';
  }else h+='<div class="sum">近 30 天没有该地址的配送记录（新客或流失）。</div>';
  el.innerHTML=h;
  document.querySelectorAll('.pin').forEach(function(pn,idx){pn.classList.toggle('hi',+pn.getAttribute('data-i')===i);});
}

/* 点档案→对应点闪烁；同用户多地址全部一起闪并框到一屏 */
var flashRings=[];
function flashPts(idxs){
  flashRings.forEach(function(r){r.setMap(null);});flashRings=[];
  document.querySelectorAll('.pin.flash').forEach(function(pn){pn.classList.remove('flash');});
  idxs.forEach(function(j){
    var pn=document.querySelector('.pin[data-i="'+j+'"]');
    if(pn){void pn.offsetWidth;pn.classList.add('flash');setTimeout(function(){pn.classList.remove('flash');},2600);}
    flashRings.push(new AMap.Marker({position:[pts[j].lng,pts[j].lat],map:map,zIndex:250,anchor:'center',content:'<div class="pulse"></div>'}));
  });
  setTimeout(function(){flashRings.forEach(function(r){r.setMap(null);});flashRings=[];},3000);
}

/* ===== 列表 + 筛选 ===== */
function renderList(){
  var el=document.getElementById('list'),h='';
  pts.map(function(p,i){return {p:p,i:i};})
    .filter(function(x){return filterOn[x.p.cls];})
    .sort(function(a,b){return a.p.lastDays-b.p.lastDays;})
    .forEach(function(x){var p=x.p;
      h+='<div class="li" data-i="'+x.i+'"><span class="dot" style="background:'+CLS[p.cls].c+'"></span>'
        +'<span class="nm"'+(bcMap[p.name]?' style="color:#e4572e"':'')+'>'+esc(p.name)+(bcMap[p.name]?' 🔥':'')+'</span><span class="ad">'+esc(addrShort(p.addr))+' · '+(WIN[p.win]||'')+'</span>'
        +'<span class="last">'+(p.lastDays<=30?p.lastDays+'天前':'30天+')+'</span></div>';});
  el.innerHTML=h||'<div style="padding:20px;text-align:center;color:#8a9490;font-size:12px">该分层暂无客户</div>';
  el.querySelectorAll('.li').forEach(function(li){li.onclick=function(){var i=+li.getAttribute('data-i');showCard(i);
    var group=pts.map(function(p,j){return p.name===pts[i].name?j:-1;}).filter(function(j){return j>=0;});
    if(group.length>1){   // 同用户两个地址：两点同闪+一屏框住，肉眼可辨
      flashPts(group);
      map.setFitView(group.map(function(j){return markers[j].m;}),false,[90,90,90,90],16);
    }else{
      flashPts([i]);
      map.setZoomAndCenter(15,[pts[i].lng,pts[i].lat]);
    }
  };});
}
var filterOn={act:true,fade:true,lost:true};
document.querySelectorAll('.fbtn[data-f]').forEach(function(b){
  b.onclick=function(){var k=b.getAttribute('data-f');filterOn[k]=!filterOn[k];b.classList.toggle('on',filterOn[k]);
    markers.forEach(function(mk){var show=filterOn[mk.cls]&&!txtCollapsed;if(show)mk.m.show();else mk.m.hide();if(show)mk.dot.show();else mk.dot.hide();});
    renderList();};
});
/* 收起文字：只看圆点分布（点大小=近30天单量） */
var txtCollapsed=false;
function applyTxt(){markers.forEach(function(mk){var show=filterOn[mk.cls]&&!txtCollapsed;if(show)mk.m.show();else mk.m.hide();});
  document.getElementById('btnTxt').textContent=txtCollapsed?'展开文字':'收起文字';}
document.getElementById('btnTxt').onclick=function(){txtCollapsed=!txtCollapsed;applyTxt();};
renderList();

/* ===== 数据源徽标 ===== */
var sb=document.getElementById('srcBadge');
if(demo){sb.className='srcBadge';sb.textContent='⚠ 演示数据 '+log.length+' 条（点此清空，改用真实报单积累）';
  sb.onclick=function(){if(confirm('清空演示配送记录？之后由主工具每次识别报单自动积累真实记录。')){localStorage.removeItem('deliveryLog');location.reload();}};}
else{sb.className='srcBadge real';sb.textContent='✓ 真实配送记录 '+log.length+' 条'+(logMaxD?(' · 截至 '+logMaxD+'（倒查 7/14 天）'):'');}

/* ===== 客诉联动（badcase-tracker 云端 data.json，仅匹配填了客户名的记录） ===== */
function loadBc(){
  fetch('https://tomtang0512.github.io/badcase-tracker/data.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(!d||!Array.isArray(d.records))return;
      var m={};
      d.records.forEach(function(rc){
        var nm=String(rc.customerName||'').trim();if(!nm)return;
        var b=m[nm]||(m[nm]={n:0,last:'',tps:[]});
        b.n++;
        if(String(rc.date||'')>b.last)b.last=String(rc.date||'');
        var t=String(rc.type||'').split('·').pop().trim();if(t&&b.tps.indexOf(t)<0)b.tps.push(t);
      });
      bcMap=m;
      markers.forEach(function(mk){   // 地图红边：有客诉史的点描红（setContent 重设，避免被地图重绘覆盖）
        if(bcMap[pts[mk.i].name]){
          try{mk.dot.setOptions({strokeColor:'#e4572e',strokeWeight:3.5});}catch(e){}
          try{var ch=mk.m.getContent();if(ch&&String(ch).indexOf('#e4572e')<0)mk.m.setContent(String(ch).replace(/border-color:[^;'"]+/,'border-color:#e4572e'));}catch(e2){}
        }
      });
      renderList();
    }).catch(function(){});
}
loadBc();
</script>
